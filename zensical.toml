[project]
site_name = "Bastion"
site_url = "https://docs.bastion.denied.se"
site_description = "An SSH client for iPhone, iPad, Mac, Apple TV, Linux, Windows and Android."
repo_url = "https://github.com/pissmyran/bastion"
repo_name = "pissmyran/bastion"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
copyright = "Bastion – Apache-2.0"
nav = [
  { "Home" = "index.md" },
  { "Platforms" = "platforms.md" },
  { "Sync format" = "sync-format.md" },
  { "Contribute" = "contributing.md" },
]
extra_css = [
  "stylesheets/extra.css",
]

[project.extra]
tagline = "One SSH client, four platforms. Pick yours below; each platform has its own repo, versions and documentation."

[project.theme]
variant = "modern"
language = "en"
custom_dir = "overrides"
logo = "assets/bastion.svg"
favicon = "assets/bastion.svg"
features = [
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.tracking",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.path",
  "navigation.top",
  "navigation.footer",
  "toc.follow",
  "search.highlight",
  "content.action.edit",
  "content.action.view",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Follow the system theme"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
accent = "deep orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "deep orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to the system theme"

# The pages were renamed when the hub switched to English; keep the old URLs working.
[project.plugins.redirects.redirect_maps]
"plattformar.md" = "platforms.md"
"synkformat.md" = "sync-format.md"
"bidra.md" = "contributing.md"
