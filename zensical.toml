[project]
site_name = "Bastion"
site_url = "https://docs.bastion.denied.se"
site_description = "En SSH-klient för iPhone, iPad, Mac, Apple TV, Linux, Windows och Android."
repo_url = "https://github.com/pissmyran/bastion"
repo_name = "pissmyran/bastion"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
copyright = "Bastion – Apache-2.0"
nav = [
  { "Start" = "index.md" },
  { "Plattformarna" = "plattformar.md" },
  { "Synkformat" = "synkformat.md" },
  { "Bidra" = "bidra.md" },
]
extra_css = [
  "stylesheets/extra.css",
]

[project.extra]
tagline = "En SSH-klient, fyra plattformar. Välj din nedan; varje plattform har eget repo, egna versioner och egen dokumentation."

[project.theme]
variant = "modern"
language = "sv"
custom_dir = "overrides"
logo = "assets/bastion.svg"
favicon = "assets/bastion.svg"
features = [
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.tracking",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.path",
  "navigation.top",
  "navigation.footer",
  "toc.follow",
  "search.highlight",
  "content.action.edit",
  "content.action.view",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Följ systemets tema"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
accent = "deep orange"
toggle.icon = "lucide/sun"
toggle.name = "Byt till mörkt tema"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "deep orange"
toggle.icon = "lucide/moon"
toggle.name = "Byt till systemets tema"
