# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: false
enable_free_tier: true
reviews:
  profile: chill
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
  auto_approvals:
    enabled: false
    max_merge_risk: minimal
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
    custom: []
  post_merge_actions: []
chat:
  auto_reply: true
issue_enrichment:
  auto_enrich:
    enabled: false
  planning:
    enabled: false
    auto_planning:
      enabled: false
