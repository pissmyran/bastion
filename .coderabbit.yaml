# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

inheritance: true

reviews:
  path_instructions:
    # Publicering av versioner.
    - path: ".github/{workflows/release.yml,scripts/semantic_release.py,scripts/wait_for_checks.py,release-baseline,release-required-checks}"
      instructions: |
        När releasebeslut eller kontrollgrind ändras, kontrollera
        att tagg, kontroller och publicering avser samma target_sha.
        Saknade, väntande eller misslyckade obligatoriska kontroller
        får inte räknas som godkända. Kontrollera paginering och
        senaste resultat per kontroll och utfärdare vid omkörningar.
        Repot är ett nav utan kod; CodeQL för Actions är den kontroll
        som finns. Kod och kodkontroller hör hemma i plattformsrepona.

    # Ärendemallar som skickar vidare till plattformsrepona.
    - path: ".github/ISSUE_TEMPLATE/**"
      instructions: |
        Kontrollera att länkarna pekar på rätt plattformsrepo och att
        mallarna inte ber om hemligheter eller sårbarhetsdetaljer.
