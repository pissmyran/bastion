# Bygger Android-appen med Gradle Wrapper på senaste JDK. Bara GitHubs egna
# actions; beroendena följs av Renovate, så ingen separat beroendegraf.
name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  # En gång i veckan, eftersom allt följer senaste versionen.
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: latest
          distribution: temurin
          cache: gradle
          cache-dependency-path: |
            Android/**/*.gradle*
            Android/**/gradle-wrapper.properties
      - name: Bygg med Gradle Wrapper
        run: ./gradlew build --no-daemon
